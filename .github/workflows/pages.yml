name: GitHub Pages
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target-wasm
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target-wasm
          cache-directories: tools
          key: pages-wasm
      - uses: actions/configure-pages@v5
      - run: scripts/web-setup.sh
      - run: scripts/web-build.sh
      - name: Only client code ships; enforce Pages file size limit
        run: |
          find web/dist -type f \( -name '*.br' -o -name '*.gz' \) -delete
          touch web/dist/.nojekyll
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('web/dist').rglob('*'):
              if p.is_file():
                  assert p.suffix.lower() not in {'.mpq', '.adt', '.blp', '.dbc', '.m2', '.wmo', '.ttf'}, p
                  assert p.stat().st_size < 100_000_000, f'{p} exceeds Pages 100 MB limit'
          PY
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
