# Market Day Mayhem cast (redesigned 2026-11-03 with the district plan in docs/azeroll/katamari-room-design.md
# §6). The original Goldshire spawns (CMaNGOS-derived display ids, Kira's and Bo's real waypoints,
# Andrew's loop) plus the invented fair crowd; everyone is placed in the vignette they belong to, and
# nobody is indoors: the inn is shut ("gone to the fair"; Level 1 owns its interior).
# Spawn/waypoint data derived from CMaNGOS classic-db (GPL-3.0).
# Provenance and exact source revisions: docs/azeroll/data/goldshire-npcs.json.
# The two road patrols are authored; the tannery formation uses VMaNGOS spacing.
#
# Optional per-NPC fields (ours, not from the databases; see npcs.rs for what they do):
#   carry   = "mug" | "stein" | "bread" | "apple" | "hammer" | "cleaver" | "bottle" | "jug"
#             | "pumpkin" | "watermelon" | "fish" | "cheese"
#             what the NPC drops, as a small collectible, the first time it bolts.
#   partner = "<another NPC's name>"   they flee holding hands, and mourn if the other is rolled up.
#   activity = "chat" | "work" | "eat" | "sleep" | "bark" (stallholder cries wares) | "dance" |
#              "applaud" | "fish"
#   quirk   = "polish"  never reacts until rolled up (the innkeeper keeps polishing his mug)
#           | "sleeper" sleeps through everything until the ball is on top of them
#           | "brave"   a guard who charges a ball that can only dislodge him, bounces off, then flees

