# D33, replay-design.md 4.1: a cousin of Fizzwick, counting the cellar rats in their cheese hoard.
# Display 3121 (gnome girl, pigtails). She ignores a ball below `catch[0]`, waves, speaks and circles
# the Colossal Swiss inside the window, and cowers above `catch[1]`. `scale` multiplies the display's
# own: the cousin opens (becomes edible) at D 2.15 x her height, so `catch[0]` follows the measured
# `azeroll NPC: ... axis=` line in the log (0.52 yd: she opens at D 1.12).
[[npc]]
name = "Pippa Fizzwick"
role = "cousin"
cousin = "pippa"
scene = "last call"
activity = "work"
carry = "cheese"
display = 3121
scale = 0.45
catch = [1.12, 1.7]
caption = "Forty-one, forty-two… do NOT roll up the rats, I am COUNTING."
at = [-9466.5, -4.0, 49.8]
yaw = 2.0
indoors = true
